name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: xcodebuild test -project PetChat.xcodeproj -scheme PetChat -destination 'platform=macOS' -only-testing:PetChatTests -parallel-testing-enabled NO CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES
      - name: Build DMG
        run: scripts/make-dmg.sh "${GITHUB_REF_NAME#v}"
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/PetChat-${GITHUB_REF_NAME#v}.dmg" --draft --generate-notes --title "Pet Chat ${GITHUB_REF_NAME#v}"
